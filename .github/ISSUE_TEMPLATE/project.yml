name: Submit a project
description: Suggest an AI product, app or tool for the SOTA collection.
title: "[Project] "
body:
  - type: markdown
    attributes:
      value: |
        Commercial products and open-source tools are welcome. No public source code is required.
        Tell us what the project solves and why it belongs in SOTA.
        Submissions are public. Do not include private information.
        Automated checks assist a maintainer; passing them does not guarantee inclusion.
  - type: input
    id: name
    attributes:
      label: Product name
      description: "The name people will recognize (up to 100 characters)."
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Project website
      description: "Official HTTPS website. Required when no GitHub repository is provided."
      placeholder: "https://example.com"
    validations:
      required: false
  - type: input
    id: repo
    attributes:
      label: GitHub repository
      description: "Optional. Public GitHub URL, if available. You do not need to open-source your product."
      placeholder: https://github.com/owner/repo
    validations:
      required: false
  - type: textarea
    id: purpose
    attributes:
      label: What does it do?
      description: One plain-text sentence, 5–200 characters.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is it worth including?
      description: Intended audience, distinctive benefits and known limitations; 5–600 characters, without Markdown headings.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence links
      description: 1–3 HTTPS links to the official website, documentation or demo, one per line.
    validations:
      required: true
  - type: input
    id: logo
    attributes:
      label: Project logo
      description: "Optional. Direct HTTPS URL to the official logo (PNG, JPEG or WebP, up to 2 MB). Leave blank for a default icon, or the GitHub owner's avatar if a repository is provided. Images are reviewed and stored before publication."
      placeholder: "https://example.com/logo.png"
    validations:
      required: false
  - type: input
    id: documentation
    attributes:
      label: Documentation
      description: "Optional. Official documentation."
      placeholder: "https://docs.example.com"
    validations:
      required: false
  - type: input
    id: demo
    attributes:
      label: Demo
      description: "Optional. A demo maintained by the project."
      placeholder: "https://demo.example.com"
    validations:
      required: false
  - type: input
    id: x
    attributes:
      label: Official X profile
      description: "Optional. Project profile only; put posts in Evidence links."
      placeholder: "https://x.com/username"
    validations:
      required: false
  - type: input
    id: discord
    attributes:
      label: Discord
      description: "Optional. The official community invitation."
      placeholder: "https://discord.gg/invite-code"
    validations:
      required: false
  - type: textarea
    id: customLinks
    attributes:
      label: Other project links
      description: "Optional. One per line: Label | HTTPS URL. Maximum 10 project links in total."
      placeholder: "YouTube | https://www.youtube.com/@your-project"
    validations:
      required: false
