name: Submit a project
description: Suggest an AI product, app or tool for the SOTA collection.
title: "[Project] "
body:
  - type: markdown
    attributes:
      value: |
        Commercial products and open-source tools are welcome. No public source code is required.
        Start with your product URL at https://sota.cc/submit/ for an AI-assisted draft, or enter a name and summary here. Extra details are optional.
        Submissions are public. Do not include private information.
        Automated checks assist a maintainer; passing them does not guarantee inclusion.
  - type: input
    id: name
    attributes:
      label: Product name
      description: "The name people will recognize (up to 100 characters)."
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Project website
      description: "Official HTTPS website. Required when no GitHub repository is provided."
      placeholder: "https://example.com"
    validations:
      required: false
  - type: input
    id: repo
    attributes:
      label: GitHub repository
      description: "Optional. Public GitHub URL, if available. You do not need to open-source your product."
      placeholder: https://github.com/owner/repo
    validations:
      required: false
  - type: textarea
    id: purpose
    attributes:
      label: Summary
      description: One plain-text sentence, 5–200 characters.
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Optional. Choose up to 3 existing tag IDs at https://sota.cc/submit/, separated by commas. Tags are checked during review."
      placeholder: "search-retrieval, database-tools, mcp"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: "Optional. The user's difficulty before using the product. Up to 600 characters."
    validations:
      required: false
  - type: textarea
    id: audience
    attributes:
      label: Who is it for?
      description: "Optional. Up to 4 user groups, one per line, up to 100 characters each."
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: Why is it useful?
      description: "Optional. A concrete benefit, 5–600 characters, without Markdown headings."
    validations:
      required: false
  - type: textarea
    id: limitations
    attributes:
      label: Known limitations
      description: "Optional. Only documented constraints, up to 5 lines, up to 200 characters each. Leave blank if unknown."
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence links
      description: "Optional. 1–3 HTTPS links, one per line. Defaults to your official website or repository."
    validations:
      required: false
  - type: input
    id: logo
    attributes:
      label: Project logo
      description: "Optional. Direct HTTPS URL to the official logo (PNG, JPEG or WebP, up to 2 MB). Leave blank for a default icon, or the GitHub owner's avatar if a repository is provided. Images are reviewed and stored before publication."
      placeholder: "https://example.com/logo.png"
    validations:
      required: false
  - type: input
    id: documentation
    attributes:
      label: Documentation
      description: "Optional. Official documentation."
      placeholder: "https://docs.example.com"
    validations:
      required: false
  - type: input
    id: demo
    attributes:
      label: Demo
      description: "Optional. A demo maintained by the project."
      placeholder: "https://demo.example.com"
    validations:
      required: false
  - type: input
    id: x
    attributes:
      label: Official X profile
      description: "Optional. Project profile only; put posts in Evidence links."
      placeholder: "https://x.com/username"
    validations:
      required: false
  - type: input
    id: discord
    attributes:
      label: Discord
      description: "Optional. The official community invitation."
      placeholder: "https://discord.gg/invite-code"
    validations:
      required: false
  - type: textarea
    id: customLinks
    attributes:
      label: Other project links
      description: "Optional. One per line: Label | HTTPS URL. Maximum 10 project links in total."
      placeholder: "YouTube | https://www.youtube.com/@your-project"
    validations:
      required: false
